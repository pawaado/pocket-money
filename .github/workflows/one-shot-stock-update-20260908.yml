name: One-shot stock tracker update 2026-09-08
on:
  push:
    paths:
      - '.github/workflows/one-shot-stock-update-20260908.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update stock records
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/tracker.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          d['updatedAt']='2026-09-08T15:57:58+09:00'
          stocks=d.setdefault('stockRecords',[])
          records=[
            {
              'id':'stock-2782-2026-09-08','assetType':'stock','validationType':'A','retrospective':False,
              'name':'セリア','code':'2782','entryDate':'2026-09-08','status':'保有中','entryPrice':4750,
              'virtualAmount':10000,'targetPrice':5200,'stopLoss':4560,'holdDays':14,
              'analysisTime':'2026-09-08T15:57:58+09:00','currentPrice':4750,'previousClose':4570,
              'priceUpdatedAt':'2026-09-08T15:30:00+09:00','dailyChangePercent':3.94,'dayHigh':4825,'dayLow':4645,'volume':637900,
              'targetDistancePercent':9.47,'stopDistancePercent':-4.00,'riskReward':2.37,
              'thesis':'8月既存店売上高が前年同月比9.7%増。7月末に通期利益予想を上方修正し、1Qも大幅増益。9/8は終値4750円（+3.94%）で年初来高値4825円を更新し、出来高も前日25.08万株から63.79万株へ増加。好業績と月次モメンタムを評価。追随買いの過熱リスクを考慮し、9/7安値4550円近辺を割る4560円を終値ベース損切り、上値目標5200円。',
              'marketDataSource':'Yahoo!ファイナンス 2782.T 2026-09-08 15:30 / 株探 2026-09-08 月次材料',
              'auditStatus':'pre_entry_locked_daily_close'
            },
            {
              'id':'stock-7856-2026-09-08','assetType':'stock','validationType':'A','retrospective':False,
              'name':'萩原工業','code':'7856','entryDate':'2026-09-08','status':'保有中','entryPrice':1998,
              'virtualAmount':10000,'targetPrice':2150,'stopLoss':1940,'holdDays':14,
              'analysisTime':'2026-09-08T15:57:58+09:00','currentPrice':1998,'previousClose':1901,
              'priceUpdatedAt':'2026-09-08T15:30:00+09:00','dailyChangePercent':5.10,'dayHigh':2110,'dayLow':1950,'volume':706600,
              'targetDistancePercent':7.61,'stopDistancePercent':-2.90,'riskReward':2.62,
              'thesis':'9/7発表の3Q累計営業利益が前年同期比38.2%増。主力の合成樹脂加工製品が牽引し、日本政策投資銀行との資本・業務提携も材料。9/8は終値1998円（+5.10%）、高値2110円・安値1950円、出来高70.66万株と直近5日平均を大きく上回った。高値から押し戻されたため追い高値リスクはあるが、材料と出来高増を評価。1950円近辺の当日安値割れを想定した1940円を終値ベース損切り、目標2150円。',
              'marketDataSource':'Yahoo!ファイナンス 7856.T 2026-09-08 15:30 / 株探 2026-09-07 決算・資本業務提携',
              'auditStatus':'pre_entry_locked_daily_close'
            }
          ]
          ids={r.get('id') for r in stocks}
          for r in records:
              if r['id'] not in ids:
                  stocks.append(r)
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/tracker.json
          git rm .github/workflows/one-shot-stock-update-20260908.yml
          git commit -m 'Update stock tracker for 2026-09-08'
          git push
