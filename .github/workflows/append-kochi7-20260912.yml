name: Append Kochi 7R EV record

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/append-kochi7-20260912.yml'

permissions:
  contents: write

jobs:
  append-record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Append pre-race record without duplicates
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('data/tracker.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          record_id = 'keiba-A-2026-09-12-kochi-7-8-slayer-win'
          if not any(r.get('id') == record_id for r in data.get('keibaRecords', [])):
              data.setdefault('keibaRecords', []).append({
                  'id': record_id,
                  'assetType': 'keiba',
                  'validationType': 'A',
                  'retrospective': False,
                  'raceDate': '2026-09-12',
                  'track': '高知',
                  'raceNo': 7,
                  'startTime': '18:20',
                  'betType': '単勝',
                  'selection': '8 スレイラー',
                  'predProb': 0.18,
                  'evalOdds': 7.2,
                  'estimatedEVPercent': 129.6,
                  'evBand5Percent': '125-130%',
                  'minimumPurchaseOdds': 5.56,
                  'stake': 100,
                  'popularity': 2,
                  'decision': '仮想購入',
                  'analysisTime': '2026-09-12T18:00:37+09:00',
                  'oddsObservedAt': '2026-09-12T17:49:00+09:00',
                  'weather': '曇',
                  'trackCondition': '不良',
                  'distanceCourse': '高知ダ1300m右',
                  'gate': '7枠8番',
                  'jockey': '多田羅誠也',
                  'weightCarriedKg': 55.0,
                  'bodyWeightInfo': '460kg、前走比-3kg。',
                  'trainingInfo': '公開検索で当日・直前の独立した調教時計は確認できず。未取得要素として勝率を保守補正。',
                  'runningStyle': '中団〜好位想定。8/30佐賀1400m良を1:29.5で勝利、8/1高知1300m良3着。4/26高知1300m不良を1:22.4で勝っており道悪実績を評価。',
                  'analysisMemo': '結果判明前のA事前記録。高知7R C3-8、10頭、ダ1300m右、発走18:20。17:49時点で曇・不良、単勝7.2倍2番人気。公開出馬表で10頭の出走を確認し、本馬8番の取消・騎手変更表示なし。近走は8/30佐賀1400m良1着1:29.5、8/1高知1300m良3着1:26.9、7/12高知1300m稍重6着、4/26高知1300m不良1着1:22.4、4/11高知1400m不良1着。特に不良馬場実績をプラス評価。多田羅誠也55kg、460kg(-3kg)。事前AIでは7番と8番が指数上位で、8番はV1予想31.0%、V3指数56.2で1位。ただしAI表示確率は全馬で相互排他的に正規化されていないため、そのまま勝率には使わない。市場1番人気9ライトスリーが1.0倍と強く支持され、古馬混合での相手関係、独立調教時計未取得も割り引いて独自勝率は18%に抑制。EV=18%×7.2=129.6%、最低購入オッズ5.56倍。',
                  'sources': [
                      'スポーツナビ 2026-09-12 高知7R 17:49時点出馬表・単勝オッズ・曇・不良・馬体重・騎手斤量',
                      '地方競馬AI予想ラボ 2026-09-12 高知7R 事前指数・脚質分類',
                      '楽天競馬 スレイラー競走履歴 2026-08-30更新・近走成績'
                  ],
                  'resultStatus': '未確定',
                  'finalOdds': None,
                  'payoutPer100': None,
                  'virtualProfit': None,
                  'auditStatus': 'pre_race_locked_result_unconfirmed'
              })
              data['updatedAt'] = '2026-09-12T18:00:37+09:00'
              path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Commit tracker update and remove one-shot workflow
        shell: bash
        run: |
          git config user.name 'pocket-money-bot'
          git config user.email 'pocket-money-bot@users.noreply.github.com'
          git add data/tracker.json
          git rm .github/workflows/append-kochi7-20260912.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Add pre-race Kochi 7R EV validation [skip ci]'
          git push
